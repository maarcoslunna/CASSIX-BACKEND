<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASSIX — Oficial</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #121212;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent-red: #ff3b30;
            --accent-red-hover: #d70015;
            --border-color: #333336;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            text-align: center;
            padding: 60px 20px 40px;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInDown 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.015em;
            margin-bottom: 10px;
            color: #fff;
        }

        h1 span {
            color: var(--accent-red);
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.2rem;
            font-weight: 400;
        }

        main {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px 80px;
            flex: 1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-red);
            box-shadow: 0 12px 30px rgba(255, 59, 48, 0.15);
        }

        .card h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #fff;
        }

        .card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .details-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .price {
            font-size: 1.35rem;
            font-weight: 600;
            color: #fff;
        }

        .price::after {
            content: " €";
            color: var(--accent-red);
        }

        .stock {
            font-size: 0.85rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 20px;
        }

        button {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 980px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: 20px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            width: 100%;
        }

        button:hover {
            background-color: var(--accent-red-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .mensaje-vacio {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.1rem;
            padding: 40px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
        }

        /* Animaciones fluidas */
        @keyframes fadeInDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>CASSI<span>X</span></h1>
        <p>Diseño de vanguardia. Exclusividad absoluta.</p>
    </header>

    <main>
        <div id="contenedor-prendas" class="grid">
            <!-- Las tarjetas de productos se cargarán dinámicamente aquí con retraso escalonado -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 CASSIX. Todos los derechos reservados.</p>
    </footer>

    <script>
        async function cargarPrendas() {
            try {
                const respuesta = await fetch('/api/prendas');
                const prendas = await respuesta.json();
                
                const contenedor = document.getElementById('contenedor-prendas');
                contenedor.innerHTML = '';

                if (prendas.length === 0) {
                    contenedor.innerHTML = '<div class="mensaje-vacio">No hay prendas disponibles en este momento.</div>';
                    return;
                }

                prendas.forEach((prenda, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    // Retraso de animación escalonado (efecto cascada moderno)
                    card.style.animationDelay = `${index * 0.15}s`;
                    
                    card.innerHTML = `
                        <div>
                            <h3>${prenda.nombre}</h3>
                            <p>${prenda.descripcion || 'Prenda de alta calidad con acabados premium.'}</p>
                        </div>
                        <div>
                            <div class="details-row">
                                <span class="price">${prenda.precio.toFixed(2)}</span>
                                <span class="stock">Stock: ${prenda.stock}</span>
                            </div>
                            <button onclick="alert('Añadido a la bolsa: ${prenda.nombre}')">Adquirir</button>
                        </div>
                    `;
                    contenedor.appendChild(card);
                });
            } catch (error) {
                console.error("Error al cargar el catálogo:", error);
            }
        }

        cargarPrendas();
    </script>
</body>
</html>
